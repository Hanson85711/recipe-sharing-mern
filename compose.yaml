services:
  database:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - recipe-network

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: mongodb://database:27017/recipes
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "3001:3001"
    depends_on:
      - database
    networks:
      - recipe-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - recipe-network

networks:
  recipe-network:

volumes:
  mongo_data:
